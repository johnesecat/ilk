<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3D ASCII Ring & Box</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #canvas-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1080px;
      max-height: 1100px;
      aspect-ratio: 1080 / 1100;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background-color: #000000;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="stage" width="1080" height="1100"></canvas>
  </div>

  <script>
    // --- Canvas Projection & Scene Constants ---
    const W = 1080, H = 1100, CY = 580, F = 1740, DC = 6.0;
    const R = 1.0, r = 0.18;
    const WORDS = "ILOVEYOU";

    // Animation Timeline Keyframes (seconds)
    // 0.0 - 2.5: Box glides up into center
    // 2.5 - 4.0: Box vibrates/shakes
    // 4.0 - 6.5: Box lid hinges open to the right
    // 6.5 - 9.5: Ring emerges towards camera; Box recedes back-left
    // 9.5+: Proposal script text types out
    const T_BOX_ARRIVE = 2.5;
    const T_BOX_SHAKE  = 4.0;
    const T_BOX_OPEN   = 6.5;
    const T_RING_RISE  = 9.5;
    const T_PROPOSAL   = 9.8;

    const RING_START = [7.0, 7.8, 8.4]; // Band, Prongs, Gem fly-in timeline
    const RING_SPAN  = [1.8, 0.9, 1.1];

    const G = 0.44, T = 0.27, HC = 0.20, HP = 0.36;
    const GY = R + r + HP - 0.05;

    // --- Seeded PRNG (Mulberry32) ---
    class Mulberry32 {
      constructor(seed) { this.s = seed; }
      next() {
        let t = (this.s += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      uniform(min, max) { return min + (max - min) * this.next(); }
      normal(mean = 0, std = 1) {
        let u1 = this.next(), u2 = this.next();
        while (u1 === 0) u1 = this.next();
        return mean + std * Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
      }
      integer(min, max) { return Math.floor(this.uniform(min, max)); }
    }
    const rng = new Mulberry32(7);

    // --- 100% ASCII Point-Cloud Geometry Generators ---

    // 1. Ring Band (2,600 Points)
    function generateBand(n = 2600) {
      const P = [], N = [], D = [];
      for (let i = 0; i < n; i++) {
        const u = rng.uniform(0, 2 * Math.PI);
        const v = rng.uniform(0, 2 * Math.PI);
        const c = R + r * Math.cos(v);
        P.push([c * Math.cos(u), c * Math.sin(u), r * Math.sin(v)]);
        N.push([Math.cos(v) * Math.cos(u), Math.cos(v) * Math.sin(u), Math.sin(v)]);
        D.push(Math.abs(((u + 1.5 * Math.PI) % (2 * Math.PI) - Math.PI) / Math.PI));
      }
      return { P, N, D };
    }

    // 2. Ring Prongs (176 Points)
    function generateProngs(n = 44) {
      const P = [], N = [], D = [];
      const angles = [Math.PI / 4, 3 * Math.PI / 4, 5 * Math.PI / 4, 7 * Math.PI / 4];
      for (let a of angles) {
        const d = [Math.cos(a), 0, Math.sin(a)];
        const b = [0, R + r - 0.05, 0].map((v, idx) => v + 0.07 * d[idx]);
        const tip = [0, 1.57, 0].map((v, idx) => v + 0.38 * d[idx]);

        for (let i = 0; i < n; i++) {
          const s = i / (n - 1);
          const sinS = Math.sin(Math.PI * s);
          P.push([
            b[0] + s * (tip[0] - b[0]) + 0.04 * sinS * d[0] + rng.normal(0, 0.008),
            b[1] + s * (tip[1] - b[1]) + 0.04 * sinS * d[1] + rng.normal(0, 0.008),
            b[2] + s * (tip[2] - b[2]) + 0.04 * sinS * d[2] + rng.normal(0, 0.008)
          ]);
          N.push([...d]);
          D.push(s);
        }
      }
      return { P, N, D };
    }

    // 3. Gem Facet Vertex Cloud (1,500 Points)
    function generateGem(n = 1500) {
      const P = [], N = [], D = [];
      let minY = Infinity, maxY = -Infinity;
      const rawP = [], rawN = [];

      for (let i = 0; i < n; i++) {
        const zone = rng.next(), s = rng.next(), a = rng.uniform(0, 2 * Math.PI);
        const k = Math.floor(a / (Math.PI / 8));
        const lean = 1 + 0.5 * (k % 2);
        const c = Math.cos((k + 0.5) * Math.PI / 8) * lean;
        const sn = Math.sin((k + 0.5) * Math.PI / 8) * lean;

        const top = zone < 0.45, mid = zone < 0.6;
        let rad, y, nx, ny, nz;
        if (top) {
          rad = G + (T - G) * s;
          y = GY + HC * s;
          nx = HC * c; ny = G - T; nz = HC * sn;
        } else if (mid) {
          rad = T * Math.sqrt(s);
          y = GY + HC;
          nx = 0; ny = 1; nz = 0;
        } else {
          rad = G * (1 - s);
          y = GY - HP * s;
          nx = HP * c; ny = -G; nz = HP * sn;
        }

        const len = Math.hypot(nx, ny, nz);
        rawP.push([rad * Math.cos(a), y, rad * Math.sin(a)]);
        rawN.push([nx / len, ny / len, nz / len]);
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }

      for (let i = 0; i < n; i++) {
        P.push(rawP[i]);
        N.push(rawN[i]);
        D.push((rawP[i][1] - minY) / (maxY - minY));
      }
      return { P, N, D };
    }

    // 4. Parametric ASCII Ring Box Base + Cushion Surface Generator (1,400 Points)
    function generateBoxBase(n = 1400) {
      const P = [], N = [], D = [], KIND = [];
      const bw = 1.7, bh = 0.7, bd = 1.7; // Box dimensions

      for (let i = 0; i < n; i++) {
        const face = rng.integer(0, 6);
        const u = rng.uniform(-0.5, 0.5);
        const v = rng.uniform(-0.5, 0.5);
        let pos = [0, 0, 0], norm = [0, 0, 0], kind = 3; // 3: Velvet Exterior

        if (face === 0) {
          // Top Surface / Velvet Insert Cushion & Gold Trim
          pos = [u * bw, bh / 2, v * bd];
          norm = [0, 1, 0];
          const isRim = Math.abs(u) > 0.42 || Math.abs(v) > 0.42;
          const isSlot = !isRim && Math.abs(u) < 0.08 && Math.abs(v) < 0.35;
          kind = isRim ? 5 : (isSlot ? 6 : 4); // 5: Gold Rim, 4: Red Cushion, 6: Shadow Slot
          if (isSlot) pos[1] -= 0.08;
        } else if (face === 1) {
          pos = [u * bw, -bh / 2, v * bd]; norm = [0, -1, 0];
        } else if (face === 2) {
          pos = [bw / 2, u * bh, v * bd]; norm = [1, 0, 0];
        } else if (face === 3) {
          pos = [-bw / 2, u * bh, v * bd]; norm = [-1, 0, 0];
        } else if (face === 4) {
          pos = [u * bw, v * bh, bd / 2]; norm = [0, 0, 1];
        } else {
          pos = [u * bw, v * bh, -bd / 2]; norm = [0, 0, -1];
        }

        P.push(pos);
        N.push(norm);
        D.push(rng.next());
        KIND.push(kind);
      }
      return { P, N, D, KIND };
    }

    // 5. Parametric ASCII Box Lid Surface Generator (900 Points)
    function generateBoxLid(n = 900) {
      const P = [], N = [], D = [], KIND = [];
      const bw = 1.7, bh = 0.6, bd = 1.7;

      for (let i = 0; i < n; i++) {
        const face = rng.integer(0, 6);
        const u = rng.uniform(-0.5, 0.5);
        const v = rng.uniform(-0.5, 0.5);
        let pos = [0, 0, 0], norm = [0, 0, 0], kind = 3;

        // Local coordinates relative to hinge pivot (hinge at z = +bd/2)
        if (face === 0) {
          pos = [u * bw, bh, v * bd - bd / 2]; norm = [0, 1, 0];
          kind = 3;
        } else if (face === 1) {
          pos = [u * bw, 0, v * bd - bd / 2]; norm = [0, -1, 0];
          kind = (Math.abs(u) > 0.42 || Math.abs(v) > 0.42) ? 5 : 4; // Interior Satin
        } else if (face === 2) {
          pos = [bw / 2, u * bh + bh / 2, v * bd - bd / 2]; norm = [1, 0, 0];
        } else if (face === 3) {
          pos = [-bw / 2, u * bh + bh / 2, v * bd - bd / 2]; norm = [-1, 0, 0];
        } else if (face === 4) {
          pos = [u * bw, v * bh + bh / 2, 0]; norm = [0, 0, 1];
        } else {
          pos = [u * bw, v * bh + bh / 2, -bd]; norm = [0, 0, -1];
        }

        P.push(pos);
        N.push(norm);
        D.push(rng.next());
        KIND.push(kind);
      }
      return { P, N, D, KIND };
    }

    // --- Build Composite Scene Datasets ---
    const ringParts = [generateBand(), generateProngs(), generateGem()];
    const boxBase = generateBoxBase();
    const boxLid  = generateBoxLid();

    const RING_P = [], RING_N = [], RING_D = [], RING_KIND = [], RING_LET = [], RING_FAR = [];
    ringParts.forEach((part, kIndex) => {
      for (let i = 0; i < part.P.length; i++) {
        RING_P.push(part.P[i]);
        RING_N.push(part.N[i]);
        RING_D.push(part.D[i]);
        RING_KIND.push(kIndex); // 0: Band, 1: Prongs, 2: Gem
        RING_LET.push(WORDS[rng.integer(0, WORDS.length)]);
        RING_FAR.push([rng.normal(0, 1.4), rng.normal(0, 1.4), rng.normal(0, 1.4)]);
      }
    });

    function initBoxData(data) {
      const LET = [], FAR = [];
      for (let i = 0; i < data.P.length; i++) {
        LET.push(WORDS[rng.integer(0, WORDS.length)]);
        FAR.push([rng.normal(0, 1.2), rng.normal(0, 1.2), rng.normal(0, 1.2)]);
      }
      return { ...data, LET, FAR };
    }
    const BOX_BASE = initBoxData(boxBase);
    const BOX_LID  = initBoxData(boxLid);

    const STARS = [];
    for (let i = 0; i < 70; i++) {
      STARS.push([rng.next(), rng.next(), rng.next()]);
    }

    // --- Vector Math Utilities ---
    function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
    function norm(v) {
      const l = Math.hypot(v[0], v[1], v[2]);
      return l === 0 ? [0, 0, 0] : [v[0] / l, v[1] / l, v[2] / l];
    }
    function rotX(p, angle) {
      const c = Math.cos(angle), s = Math.sin(angle);
      return [p[0], p[1] * c - p[2] * s, p[1] * s + p[2] * c];
    }
    function rotY(p, angle) {
      const c = Math.cos(angle), s = Math.sin(angle);
      return [p[0] * c + p[2] * s, p[1], p[2] * c - p[0] * s];
    }
    function rotZ(p, angle) {
      const c = Math.cos(angle), s = Math.sin(angle);
      return [p[0] * c - p[1] * s, p[0] * s + p[1] * c, p[2]];
    }
    function rot3D(p, rx, ry, tilt = 0.3) {
      // Rotate Y, then X, then Apply Camera Tilt
      let v = rotY(p, ry);
      v = rotX(v, rx);
      const ct = Math.cos(tilt), st = Math.sin(tilt);
      return [v[0], v[1] * ct - v[2] * st, v[1] * st + v[2] * ct];
    }

    const ORBITS = [
      { ex: [1, 0.3, 0], ey: [0, 0.2, 1], rx: 1.55, ry: 0.7, sp: 1.3 },
      { ex: [1, -0.35, 0], ey: [0, 0.9, 0.5], rx: 1.4, ry: 0.8, sp: -1.1 }
    ];

    function getOrbitPoint(t, ex, ey, rx, ry, sp, j, m = 70) {
      const a = (j / (m - 1)) * 1.7 * Math.PI + t * sp;
      const ca = Math.cos(a), sa = Math.sin(a);
      return [
        rx * ca * ex[0] + ry * sa * ey[0],
        rx * ca * ex[1] + ry * sa * ey[1],
        rx * ca * ex[2] + ry * sa * ey[2]
      ];
    }

    function easeInOutCubic(x) {
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }

    // --- HTML5 Canvas & Offscreen Blur Setup ---
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    const bloomCanvas = document.createElement('canvas');
    bloomCanvas.width = W;
    bloomCanvas.height = H;
    const bloomCtx = bloomCanvas.getContext('2d');

    // Touch & Swipe Rotation Interaction State
    let manualRotX = 0, manualRotY = 0;
    let velRotX = 0, velRotY = 0;
    let isDragging = false;
    let lastPointerX = 0, lastPointerY = 0;
    let lastInteractionTime = 0;

    function handlePointerDown(x, y) {
      isDragging = true;
      lastPointerX = x;
      lastPointerY = y;
      velRotX = 0;
      velRotY = 0;
      lastInteractionTime = performance.now();
    }

    function handlePointerMove(x, y) {
      if (!isDragging) return;
      const dx = x - lastPointerX;
      const dy = y - lastPointerY;
      lastPointerX = x;
      lastPointerY = y;

      velRotY = dx * 0.005;
      velRotX = dy * 0.005;
      manualRotY += velRotY;
      manualRotX += velRotX;
      lastInteractionTime = performance.now();
    }

    function handlePointerUp() {
      isDragging = false;
    }

    window.addEventListener('mousedown', (e) => handlePointerDown(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', handlePointerUp);

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) handlePointerDown(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    window.addEventListener('touchend', handlePointerUp);

    // --- Safari & Mobile Safe Canvas Text Renderer ---
    function renderPointGlyph(targetCtx, charStr, px, py, fontSize, rC, gC, bC) {
      targetCtx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace`;
      targetCtx.fillStyle = `rgb(${rC},${gC},${bC})`;
      targetCtx.textAlign = 'center';
      targetCtx.textBaseline = 'middle';
      targetCtx.fillText(charStr, px, py);
    }

    // --- Main Rendering Pipeline ---
    function draw(t) {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);

      // Inertial Momentum Decay & Fallback Auto-Rotation
      if (!isDragging) {
        manualRotX += velRotX;
        manualRotY += velRotY;
        velRotX *= 0.92;
        velRotY *= 0.92;

        if (performance.now() - lastInteractionTime > 2000) {
          manualRotY += 0.006;
        }
      }

      // Draw Starfield Background
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = 0; i < STARS.length; i++) {
        const [sx, sy, ss] = STARS[i];
        const v = Math.floor(30 + 50 * Math.abs(Math.sin(t * ss * 3 + i)));
        const py = ((sy * H - t * ss * 40) % H + H) % H;
        renderPointGlyph(ctx, '+', sx * W, py, 14, v, v, v);
      }

      // Lighting Vectors
      const L1 = norm([-0.5, 0.7, 0.8]);
      const L2 = norm([Math.cos(t * 2.2), 0.35, Math.sin(t * 2.2)]);
      const H1 = norm([L1[0], L1[1], L1[2] + 1]);
      const H2 = norm([L2[0], L2[1], L2[2] + 1]);

      // Calculate Box State & Position via Timeline
      let boxPos = [0, 0, 0];
      let lidAngle = 0;

      if (t < T_BOX_ARRIVE) {
        const p = easeInOutCubic(t / T_BOX_ARRIVE);
        boxPos = [0, (1 - p) * -5.0, 0];
      } else if (t < T_BOX_SHAKE) {
        const st = (t - T_BOX_ARRIVE) * 22;
        boxPos = [Math.sin(st) * 0.04, 0, Math.cos(st * 0.8) * 0.04];
      } else if (t < T_BOX_OPEN) {
        const p = easeInOutCubic((t - T_BOX_SHAKE) / (T_BOX_OPEN - T_BOX_SHAKE));
        lidAngle = p * (Math.PI * 0.72); // Opens to right/back
      } else if (t < T_RING_RISE) {
        lidAngle = Math.PI * 0.72;
        const p = easeInOutCubic((t - T_BOX_OPEN) / (T_RING_RISE - T_BOX_OPEN));
        boxPos = [-1.4 * p, -0.6 * p, -2.0 * p]; // Box shifts back and left
      } else {
        lidAngle = Math.PI * 0.72;
        boxPos = [-1.4, -0.6, -2.0];
      }

      // Calculate Ring Center Position via Timeline
      let ringPos = [0, 0, 0];
      if (t > T_BOX_OPEN) {
        const p = easeInOutCubic(Math.min(1.0, (t - T_BOX_OPEN) / (T_RING_RISE - T_BOX_OPEN)));
        ringPos = [0, p * 0.3, p * 1.3];
      }

      // Unified Render Queue for Painter's Algorithm Depth Sorting
      const renderList = [];
      let glintHits = 0;

      // 1. Process Box Base ASCII Points
      for (let i = 0; i < BOX_BASE.P.length; i++) {
        const pLocal = BOX_BASE.P[i];
        const nLocal = BOX_BASE.N[i];
        const k = BOX_BASE.KIND[i];

        const worldP = [pLocal[0] + boxPos[0], pLocal[1] + boxPos[1], pLocal[2] + boxPos[2]];
        const q = rot3D(worldP, manualRotX, manualRotY);
        const n = rot3D(nLocal, manualRotX, manualRotY);

        const dif = Math.max(0, dot(n, L1));
        const spec = Math.pow(Math.max(0, dot(n, H1)), 15);
        let rC, gC, bC;

        if (k === 5) { // Gold Rim
          const bb = 0.3 + 0.7 * dif;
          rC = Math.floor(215 * bb + spec * 100);
          gC = Math.floor(170 * bb + spec * 100);
          bC = Math.floor(50 * bb);
        } else if (k === 4) { // Inner Cushion
          rC = Math.floor(110 * (0.2 + 0.8 * dif));
          gC = Math.floor(20 * (0.2 + 0.8 * dif));
          bC = Math.floor(35 * (0.2 + 0.8 * dif));
        } else if (k === 6) { // Shadow Slot
          rC = 15; gC = 10; bC = 15;
        } else { // Exterior Velvet Red
          const bb = 0.2 + 0.8 * dif;
          rC = Math.floor(180 * bb);
          gC = Math.floor(25 * bb);
          bC = Math.floor(45 * bb);
        }

        const sc = F / (DC - q[2]);
        renderList.push({
          z: q[2],
          sx: W / 2 + q[0] * sc,
          sy: CY - q[1] * sc,
          char: BOX_BASE.LET[i],
          sc: sc,
          color: [Math.min(255, rC), Math.min(255, gC), Math.min(255, bC)]
        });
      }

      // 2. Process Box Lid ASCII Points (Hinged Rotation around back edge)
      for (let i = 0; i < BOX_LID.P.length; i++) {
        const pLocal = BOX_LID.P[i];
        const nLocal = BOX_LID.N[i];
        const k = BOX_LID.KIND[i];

        // Apply lid hinge rotation around Z-axis pivot at back edge
        const pLidRot = rotZ(pLocal, lidAngle);
        const nLidRot = rotZ(nLocal, lidAngle);

        const worldP = [
          pLidRot[0] + boxPos[0],
          pLidRot[1] + boxPos[1] + 0.35,
          pLidRot[2] + boxPos[2] + 0.85
        ];

        const q = rot3D(worldP, manualRotX, manualRotY);
        const n = rot3D(nLidRot, manualRotX, manualRotY);

        const dif = Math.max(0, dot(n, L1));
        const spec = Math.pow(Math.max(0, dot(n, H1)), 15);
        let rC, gC, bC;

        if (k === 5) {
          const bb = 0.3 + 0.7 * dif;
          rC = Math.floor(215 * bb + spec * 100);
          gC = Math.floor(170 * bb + spec * 100);
          bC = Math.floor(50 * bb);
        } else if (k === 4) { // Satin Inner Lid
          rC = Math.floor(200 * (0.3 + 0.7 * dif));
          gC = Math.floor(180 * (0.3 + 0.7 * dif));
          bC = Math.floor(190 * (0.3 + 0.7 * dif));
        } else {
          const bb = 0.2 + 0.8 * dif;
          rC = Math.floor(180 * bb);
          gC = Math.floor(25 * bb);
          bC = Math.floor(45 * bb);
        }

        const sc = F / (DC - q[2]);
        renderList.push({
          z: q[2],
          sx: W / 2 + q[0] * sc,
          sy: CY - q[1] * sc,
          char: BOX_LID.LET[i],
          sc: sc,
          color: [Math.min(255, rC), Math.min(255, gC), Math.min(255, bC)]
        });
      }

      // 3. Process Ring Point Cloud ASCII Characters
      const ringTime = Math.max(0, t - RING_START[0]);
      const ringBaseAng = 0.5 + 0.95 * ringTime;

      for (let i = 0; i < RING_P.length; i++) {
        const k = RING_KIND[i];
        let e = Math.min(Math.max((t - RING_START[k] - RING_D[i] * RING_SPAN[k]) / 0.7, 0), 1);
        e = 1 - Math.pow(1 - e, 3);

        const pFar = [
          RING_P[i][0] + (1 - e) * RING_FAR[i][0] + ringPos[0],
          RING_P[i][1] + (1 - e) * RING_FAR[i][1] + ringPos[1],
          RING_P[i][2] + (1 - e) * RING_FAR[i][2] + ringPos[2]
        ];

        // Apply ring auto spin + manual drag rotation
        const qRingSpin = rotY(pFar, ringBaseAng);
        const q = rot3D(qRingSpin, manualRotX, manualRotY);

        const nSpin = rotY(RING_N[i], ringBaseAng);
        const n = rot3D(nSpin, manualRotX, manualRotY);

        const spec1 = Math.pow(Math.max(0, dot(n, H1)), k === 2 ? 30 : 20);
        const spec2 = Math.pow(Math.max(0, dot(n, H2)), k === 2 ? 40 : 30);
        const dif = Math.max(0, dot(n, L1));

        const isGem = (k === 2);
        const b = isGem
          ? 0.12 + 1.3 * spec2 + 0.7 * spec1
          : 0.22 + 0.5 * dif + 0.9 * spec1 + 0.8 * spec2;

        if (isGem && b > 0.9 && e > 0.5) glintHits++;

        const bb = Math.min(Math.max(b, 0), 1);
        const hot = Math.min(Math.max(b - 0.85, 0), 1) * 255;
        const ph = Math.atan2(n[2], n[0]) * 3 + t * 3;

        const rb = [
          0.5 + 0.5 * Math.sin(ph),
          0.5 + 0.5 * Math.sin(ph + 2.1),
          0.5 + 0.5 * Math.sin(ph + 4.2)
        ];

        let rC, gC, bC;
        if (isGem) {
          const factor = 255 * bb;
          rC = factor * (0.6 + 0.4 * rb[0]);
          gC = factor * (0.6 + 0.4 * rb[1]);
          bC = factor * (0.6 + 0.4 * rb[2]);
        } else {
          rC = 90 * bb + hot;
          gC = 170 * bb + hot;
          bC = 235 * bb + hot;
        }

        const fade = Math.min(Math.max(0.6 + 0.3 * q[2], 0.2), 1) * e;
        rC = Math.floor(Math.min(Math.max(rC * fade, 0), 255));
        gC = Math.floor(Math.min(Math.max(gC * fade, 0), 255));
        bC = Math.floor(Math.min(Math.max(bC * fade, 0), 255));

        if (e >= 0.02 && Math.max(rC, gC, bC) >= 14) {
          const sc = F / (DC - q[2]);
          renderList.push({
            z: q[2],
            sx: W / 2 + q[0] * sc,
            sy: CY - q[1] * sc,
            char: RING_LET[i],
            sc: sc,
            color: [rC, gC, bC]
          });
        }
      }

      // 4. Orbiting Comets / Ring Halos
      if (t >= 8.5) {
        const kHalo = Math.min(1.0, (t - 8.5) / 1.2);
        for (let orb of ORBITS) {
          for (let j = 0; j < 70; j++) {
            const rawO = getOrbitPoint(t, orb.ex, orb.ey, orb.rx, orb.ry, orb.sp, j);
            const oSpin = rotY(rawO, ringBaseAng * 0.4);
            const oWorld = [oSpin[0] + ringPos[0], oSpin[1] + ringPos[1], oSpin[2] + ringPos[2]];
            const o = rot3D(oWorld, manualRotX, manualRotY);

            const sc = F / (DC - o[2]);
            const v = Math.floor(255 * kHalo * Math.pow(j / 69, 2));
            renderList.push({
              z: o[2],
              sx: W / 2 + o[0] * sc,
              sy: CY - o[1] * sc,
              char: WORDS[j % 8],
              sc: sc,
              color: [v, v, Math.floor(v * 0.9)]
            });
          }
        }
      }

      // --- Painter's Algorithm: Depth Sort Far to Near ---
      renderList.sort((a, b) => a.z - b.z);

      // --- Render All ASCII Points ---
      let visibleLetters = 0;
      for (let i = 0; i < renderList.length; i++) {
        const pt = renderList[i];
        const fontSize = Math.max(6, Math.floor(0.0016 * pt.sc * 20));
        renderPointGlyph(ctx, pt.char, pt.sx, pt.sy, fontSize, pt.color[0], pt.color[1], pt.color[2]);
        visibleLetters++;
      }

      // --- Dual Gaussian Blur Bloom Filter ---
      bloomCtx.clearRect(0, 0, W, H);
      bloomCtx.drawImage(canvas, 0, 0);

      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = 0.75;
      ctx.filter = 'blur(16px)';
      ctx.drawImage(bloomCanvas, 0, 0);

      ctx.globalAlpha = 0.35;
      ctx.filter = 'blur(4px)';
      ctx.drawImage(bloomCanvas, 0, 0);
      ctx.restore();

      // --- HUD Overlay Elements ---
      ctx.font = '22px monospace';
      ctx.fillStyle = 'rgb(135,135,135)';
      ctx.textAlign = 'left';

      const degY = ((manualRotY * 180 / Math.PI) % 360 + 360) % 360;
      ctx.fillText(`rotation ${degY.toFixed(2).padStart(6, ' ')} deg`, 30, 50);
      ctx.fillText(`glints   ${glintHits}`, 30, 82);
      ctx.fillText(`letters  ${visibleLetters.toLocaleString()}`, 30, 114);

      ctx.fillStyle = 'rgb(110,110,255)';
      ctx.textAlign = 'right';
      ctx.fillText(`t ${t.toFixed(2)}s`, W - 30, 50);

      // Proposal Cursive Script Overlay
      if (t > T_PROPOSAL) {
        const msg = "will you be mine forever and ever?";
        const charCount = Math.floor((t - T_PROPOSAL) * 10);
        const part = msg.substring(0, charCount);

        ctx.save();
        ctx.font = 'italic 44px "Brush Script MT", cursive, sans-serif';
        ctx.fillStyle = 'rgb(225, 235, 255)';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(225, 235, 255, 0.8)';
        ctx.shadowBlur = 12;
        ctx.fillText(part, W / 2, 1030);
        ctx.restore();
      }
    }

    // --- Main Animation Engine Loop ---
    const startTime = performance.now();
    function loop() {
      const elapsed = (performance.now() - startTime) / 1000.0;
      draw(elapsed);
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
