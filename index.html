<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3D ASCII Ring & Box Proposal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #canvas-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1080px;
      max-height: 1100px;
      aspect-ratio: 1080 / 1100;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background-color: #000000;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="stage" width="1080" height="1100"></canvas>
  </div>

  <script>
    // --- Canvas Projection & Math Constants (Matching Python ring.py) ---
    const W = 1080, H = 1100, CY = 550, F = 1740, DC = 6.0;
    const R = 1.0, r = 0.18; // Ring radius & band thickness
    const WORDS = "ILOVEYOU";

    // Animation Timeline Keyframes (Seconds)
    const T_BOX_ARRIVE  = 2.2;  // Box glides into center view from bottom
    const T_BOX_SHAKE   = 4.0;  // Box vibrates gently
    const T_BOX_OPEN    = 6.5;  // Box lid hinges open UPWARDS
    const T_SPARK_BURST = 8.5;  // Brilliant ASCII text glare burst erupts from slot
    const T_RING_EMERGE = 11.0; // Ring emerges forward to dead center
    const T_PROPOSAL    = 13.2; // Script question types out

    const START = [T_SPARK_BURST + 0.2, T_SPARK_BURST + 0.8, T_SPARK_BURST + 1.2, T_RING_EMERGE, T_PROPOSAL];
    const SPAN = [2.6, 1.0, 1.4];

    const G = 0.44, T = 0.27, HC = 0.20, HP = 0.36;
    const GY = R + r + HP - 0.05;

    // --- Seeded PRNG (Mulberry32 matching Python rng = np.random.default_rng(7)) ---
    class Mulberry32 {
      constructor(seed) { this.s = seed; }
      next() {
        let t = (this.s += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      uniform(min, max) { return min + (max - min) * this.next(); }
      normal(mean = 0, std = 1) {
        let u1 = this.next(), u2 = this.next();
        while (u1 === 0) u1 = this.next();
        return mean + std * Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
      }
      integer(min, max) { return Math.floor(this.uniform(min, max)); }
    }
    const rng = new Mulberry32(7);

    // --- Geometry Generators ---

    // 1. Ring Torus Band (2,600 Points)
    function generateBand(n = 2600) {
      const P = [], N = [], D = [];
      for (let i = 0; i < n; i++) {
        const u = rng.uniform(0, 2 * Math.PI);
        const v = rng.uniform(0, 2 * Math.PI);
        const c = R + r * Math.cos(v);
        P.push([c * Math.cos(u), c * Math.sin(u), r * Math.sin(v)]);
        N.push([Math.cos(v) * Math.cos(u), Math.cos(v) * Math.sin(u), Math.sin(v)]);
        D.push(Math.abs(((u + 1.5 * Math.PI) % (2 * Math.PI) - Math.PI) / Math.PI));
      }
      return { P, N, D };
    }

    // 2. Ring Prongs (176 Points)
    function generateProngs(n = 44) {
      const P = [], N = [], D = [];
      const angles = [Math.PI / 4, 3 * Math.PI / 4, 5 * Math.PI / 4, 7 * Math.PI / 4];
      for (let a of angles) {
        const d = [Math.cos(a), 0, Math.sin(a)];
        const b = [0, R + r - 0.05, 0].map((v, idx) => v + 0.07 * d[idx]);
        const tip = [0, 1.57, 0].map((v, idx) => v + 0.38 * d[idx]);

        for (let i = 0; i < n; i++) {
          const s = i / (n - 1);
          const sinS = Math.sin(Math.PI * s);
          P.push([
            b[0] + s * (tip[0] - b[0]) + 0.04 * sinS * d[0] + rng.normal(0, 0.008),
            b[1] + s * (tip[1] - b[1]) + 0.04 * sinS * d[1] + rng.normal(0, 0.008),
            b[2] + s * (tip[2] - b[2]) + 0.04 * sinS * d[2] + rng.normal(0, 0.008)
          ]);
          N.push([...d]);
          D.push(s);
        }
      }
      return { P, N, D };
    }

    // 3. Faceted Diamond Gem (1,500 Points)
    function generateGem(n = 1500) {
      const P = [], N = [], D = [];
      let minY = Infinity, maxY = -Infinity;
      const rawP = [], rawN = [];

      for (let i = 0; i < n; i++) {
        const zone = rng.next(), s = rng.next(), a = rng.uniform(0, 2 * Math.PI);
        const k = Math.floor(a / (Math.PI / 8)); // 16 facets around
        const lean = 1 + 0.5 * (k % 2);
        const c = Math.cos((k + 0.5) * Math.PI / 8) * lean;
        const sn = Math.sin((k + 0.5) * Math.PI / 8) * lean;

        const top = zone < 0.45, mid = zone < 0.6;
        let rad, y, nx, ny, nz;
        if (top) {
          rad = G + (T - G) * s;
          y = GY + HC * s;
          nx = HC * c; ny = G - T; nz = HC * sn;
        } else if (mid) {
          rad = T * Math.sqrt(s);
          y = GY + HC;
          nx = 0; ny = 1; nz = 0;
        } else {
          rad = G * (1 - s);
          y = GY - HP * s;
          nx = HP * c; ny = -G; nz = HP * sn;
        }

        const len = Math.hypot(nx, ny, nz);
        rawP.push([rad * Math.cos(a), y, rad * Math.sin(a)]);
        rawN.push([nx / len, ny / len, nz / len]);
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }

      for (let i = 0; i < n; i++) {
        P.push(rawP[i]);
        N.push(rawN[i]);
        D.push((rawP[i][1] - minY) / (maxY - minY));
      }
      return { P, N, D };
    }

    // 4. Squished Ring Box Base & Whitish-Grey Velvet Cushion (2,800 Points)
    function generateBoxBase(n = 2800) {
      const P = [], N = [], D = [], KIND = [];
      const bw = 1.8, bh = 0.50, bd = 1.8;

      for (let i = 0; i < n; i++) {
        const sec = rng.next();
        let pos = [0, 0, 0], norm = [0, 0, 0], kind = 3;

        if (sec < 0.48) {
          // Interior Top Plush Cushion (Whitish-Grey Satin)
          const u = rng.uniform(-bw/2 + 0.05, bw/2 - 0.05);
          const v = rng.uniform(-bd/2 + 0.05, bd/2 - 0.05);
          const absU = Math.abs(u), absV = Math.abs(v);
          const isGoldRim = absU > (bw/2 - 0.12) || absV > (bd/2 - 0.12);
          const isSlot = !isGoldRim && absU < 0.12 && absV < 0.55;

          pos = [u, bh/2, v];
          if (isGoldRim) {
            kind = 5; // Metallic Gold Trim Frame
            norm = [0, 1, 0];
          } else if (isSlot) {
            kind = 6; // Dark Inner Cushion Ring Slot
            pos[1] -= 0.12;
            norm = [0, 1, 0];
          } else {
            kind = 4; // Whitish-Grey Velvet Satin Cushion
            const cushionDome = Math.max(0, (1.0 - Math.hypot(u / (bw/2), v / (bd/2))) * 0.08);
            pos[1] += cushionDome;
            norm = [0, 1, 0];
          }
        } else if (sec < 0.90) {
          // Royal Velvet Exterior Box Walls
          const wall = rng.integer(0, 4);
          const u = rng.uniform(-0.5, 0.5);
          const h = rng.uniform(-bh/2, bh/2);

          if (wall === 0) { // Front (+Z)
            pos = [u * bw, h, bd/2]; norm = [0, 0, 1];
          } else if (wall === 1) { // Back (-Z Hinge Side)
            pos = [u * bw, h, -bd/2]; norm = [0, 0, -1];
          } else if (wall === 2) { // Right (+X)
            pos = [bw/2, h, u * bd]; norm = [1, 0, 0];
          } else { // Left (-X)
            pos = [-bw/2, h, u * bd]; norm = [-1, 0, 0];
          }

          const isGoldAccent = h > (bh/2 - 0.06);
          kind = isGoldAccent ? 5 : 3;
        } else {
          // Bottom Base Plate
          const u = rng.uniform(-bw/2, bw/2);
          const v = rng.uniform(-bd/2, bd/2);
          pos = [u, -bh/2, v]; norm = [0, -1, 0]; kind = 3;
        }

        P.push(pos); N.push(norm); D.push(rng.next()); KIND.push(kind);
      }
      return { P, N, D, KIND };
    }

    // 5. Ring Box Lid (2,400 Points - Hinges UPWARDS at Back Edge -Z)
    function generateBoxLid(n = 2400) {
      const P = [], N = [], D = [], KIND = [];
      const bw = 1.84, bh = 0.38, bd = 1.84;

      for (let i = 0; i < n; i++) {
        const sec = rng.next();
        let pos = [0, 0, 0], norm = [0, 0, 0], kind = 3;

        // Local coordinates anchored relative to Hinge Pivot Line (z = -bd to 0)
        if (sec < 0.60) {
          // Top Roof Exterior (Dense ASCII Text Matrix)
          const u = rng.uniform(-bw/2, bw/2);
          const zRel = rng.uniform(-bd, 0);
          pos = [u, bh, zRel]; norm = [0, 1, 0];

          const isGoldRim = Math.abs(u) > (bw/2 - 0.08) || zRel > -0.08 || zRel < (-bd + 0.08);
          kind = isGoldRim ? 5 : 3;
        } else if (sec < 0.80) {
          // Inner Ceiling Satin Lining (Whitish-Grey)
          const u = rng.uniform(-bw/2, bw/2);
          const zRel = rng.uniform(-bd, 0);
          pos = [u, 0.02, zRel]; norm = [0, -1, 0];
          kind = 4; // Whitish-Grey Satin Ceiling
        } else {
          // Lid Side Lips
          const wall = rng.integer(0, 4);
          const u = rng.uniform(-0.5, 0.5);
          const h = rng.uniform(0, bh);

          if (wall === 0) { // Back Lip (z = 0 Hinge)
            pos = [u * bw, h, 0]; norm = [0, 0, 1];
          } else if (wall === 1) { // Front Opening Lip (z = -bd)
            pos = [u * bw, h, -bd]; norm = [0, 0, -1];
          } else if (wall === 2) { // Right Lip (+X)
            pos = [bw/2, h, u * bd - bd/2]; norm = [1, 0, 0];
          } else { // Left Lip (-X)
            pos = [-bw/2, h, u * bd - bd/2]; norm = [-1, 0, 0];
          }

          const isGoldEdge = h < 0.05;
          kind = isGoldEdge ? 5 : 3;
        }

        P.push(pos); N.push(norm); D.push(rng.next()); KIND.push(kind);
      }
      return { P, N, D, KIND };
    }

    // --- Build Composite Scene Mesh Arrays ---
    const ringParts = [generateBand(), generateProngs(), generateGem()];
    const RING_P = [], RING_N = [], RING_D = [], RING_KIND = [], RING_LET = [], RING_FAR = [];

    ringParts.forEach((part, kIndex) => {
      for (let i = 0; i < part.P.length; i++) {
        RING_P.push(part.P[i]);
        RING_N.push(part.N[i]);
        RING_D.push(part.D[i]);
        RING_KIND.push(kIndex);
        RING_LET.push(WORDS[rng.integer(0, WORDS.length)]);
        RING_FAR.push([rng.normal(0, 1.4), rng.normal(0, 1.4), rng.normal(0, 1.4)]);
      }
    });

    function attachTextToGeometry(geo) {
      geo.LET = [];
      for (let i = 0; i < geo.P.length; i++) {
        geo.LET.push(WORDS[rng.integer(0, WORDS.length)]);
      }
    }

    const BOX_BASE = generateBoxBase();
    attachTextToGeometry(BOX_BASE);

    const BOX_LID = generateBoxLid();
    attachTextToGeometry(BOX_LID);

    const STARS = [];
    for (let i = 0; i < 70; i++) {
      STARS.push([rng.next(), rng.next(), rng.next()]);
    }

    // --- High-Intensity ASCII Sparkle Burst Generator ---
    const BURST_PARTICLES = [];
    for (let i = 0; i < 220; i++) {
      const dir = [rng.normal(0, 1), rng.normal(0, 1), rng.normal(0, 1)];
      const len = Math.hypot(dir[0], dir[1], dir[2]) || 1;
      BURST_PARTICLES.push({
        dir: [dir[0]/len, dir[1]/len, dir[2]/len],
        speed: rng.uniform(0.4, 1.8),
        size: rng.uniform(14, 38),
        char: WORDS[i % WORDS.length]
      });
    }

    // --- Vector & Quaternion Rotation Math Utilities ---
    function dot(a, b) { return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }
    function unit(v) {
      const l = Math.hypot(v[0], v[1], v[2]);
      return l === 0 ? [0,0,0] : [v[0]/l, v[1]/l, v[2]/l];
    }
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // Rotate point around X-axis (Pitch - for UPWARD Lid Opening)
    function rotX(p, angle) {
      const c = Math.cos(angle), s = Math.sin(angle);
      return [p[0], p[1] * c - p[2] * s, p[1] * s + p[2] * c];
    }

    // Rotate point around both X and Y axes (Yaw & Pitch - for User Touch Swipe)
    function rot3D(p, rx, ry) {
      // Y-axis rotation
      const cy = Math.cos(ry), sy = Math.sin(ry);
      const x1 = p[0] * cy + p[2] * sy;
      const z1 = p[2] * cy - p[0] * sy;
      // X-axis rotation
      const cx = Math.cos(rx), sx = Math.sin(rx);
      const y2 = p[1] * cx - z1 * sx;
      const z2 = p[1] * sx + z1 * cx;
      return [x1, y2, z2];
    }

    const ORBITS = [
      { ex: [1, 0.3, 0], ey: [0, 0.2, 1], rx: 1.55, ry: 0.7, sp: 1.3 },
      { ex: [1, -0.35, 0], ey: [0, 0.9, 0.5], rx: 1.4, ry: 0.8, sp: -1.1 }
    ];

    function getOrbitPoint(t, ex, ey, rx, ry, sp, j, m = 70) {
      const a = (j / (m - 1)) * 1.7 * Math.PI + t * sp;
      const ca = Math.cos(a), sa = Math.sin(a);
      return [
        rx * ca * ex[0] + ry * sa * ey[0],
        rx * ca * ex[1] + ry * sa * ey[1],
        rx * ca * ex[2] + ry * sa * ey[2]
      ];
    }

    // --- Offscreen Canvas Double-Buffer Setup for Bloom ---
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    const bloomCanvas = document.createElement('canvas');
    bloomCanvas.width = W;
    bloomCanvas.height = H;
    const bloomCtx = bloomCanvas.getContext('2d');

    // --- Touch Interaction Engine (Rotates ONLY the Ring Once Emerged) ---
    let ringRotX = 0, ringRotY = 0;
    let velRingX = 0, velRingY = 0;
    let isDragging = false;
    let lastPointerX = 0, lastPointerY = 0;

    function handlePointerDown(x, y) {
      isDragging = true;
      lastPointerX = x;
      lastPointerY = y;
      velRingX = 0; velRingY = 0;
    }

    function handlePointerMove(x, y) {
      if (!isDragging) return;
      const dx = x - lastPointerX;
      const dy = y - lastPointerY;
      lastPointerX = x;
      lastPointerY = y;

      velRingY += dx * 0.005;
      velRingX += dy * 0.005;
    }

    function handlePointerUp() { isDragging = false; }

    window.addEventListener('mousedown', (e) => handlePointerDown(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', handlePointerUp);

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) handlePointerDown(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    window.addEventListener('touchend', handlePointerUp);

    function renderPointGlyph(targetCtx, charStr, px, py, fontSize, rC, gC, bC) {
      targetCtx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace`;
      targetCtx.fillStyle = `rgb(${rC},${gC},${bC})`;
      targetCtx.textAlign = 'center';
      targetCtx.textBaseline = 'middle';
      targetCtx.fillText(charStr, px, py);
    }

    // --- Main Rendering Engine ---
    const startTime = performance.now();

    function draw(t) {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);

      // Touch Drag Inertia Friction Decay
      if (isDragging) {
        ringRotX += velRingX;
        ringRotY += velRingY;
        velRingX *= 0.5; velRingY *= 0.5;
      } else {
        ringRotX += velRingX;
        ringRotY += velRingY;
        velRingX *= 0.92;
        velRingY *= 0.92;
      }

      // Draw Starfield Background (Fixed)
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = 0; i < STARS.length; i++) {
        const [sx, sy, ss] = STARS[i];
        const v = Math.floor(30 + 50 * Math.abs(Math.sin(t * ss * 3 + i)));
        const py = ((sy * H - t * ss * 40) % H + H) % H;
        renderPointGlyph(ctx, '+', sx * W, py, 14, v, v, v);
      }

      // Lighting Direction Vectors (Facing Screen Viewer [0, 0, 1])
      const L1 = unit([-0.5, 0.7, 0.8]);
      const L2 = unit([Math.cos(t * 2.2), 0.35, Math.sin(t * 2.2)]);
      const H1 = unit([L1[0], L1[1], L1[2] + 1]);
      const H2 = unit([L2[0], L2[1], L2[2] + 1]);

      // Calculate Box Positioning & UPWARD Lid Hinge Animation
      let boxPos = [0, -0.2, 0];
      let lidAngle = 0;

      if (t < T_BOX_ARRIVE) {
        const p = easeInOutCubic(t / T_BOX_ARRIVE);
        boxPos = [0, 3.5 - p * 3.7, 0]; // Glides UP into center
      } else if (t < T_BOX_SHAKE) {
        const st = (t - T_BOX_ARRIVE) * 24;
        boxPos = [Math.sin(st) * 0.03, -0.2, Math.cos(st * 0.8) * 0.03]; // Shakes gently
      } else if (t < T_BOX_OPEN) {
        const p = easeInOutCubic((t - T_BOX_SHAKE) / (T_BOX_OPEN - T_BOX_SHAKE));
        lidAngle = -p * (Math.PI * 0.78); // Hinges UPWARDS & BACKWARDS around back edge
      } else if (t < T_RING_EMERGE) {
        lidAngle = -(Math.PI * 0.78);
        const p = easeInOutCubic((t - T_SPARK_BURST) / (T_RING_EMERGE - T_SPARK_BURST));
        boxPos = [-1.3 * p, -0.2 - 0.6 * p, -1.8 * p]; // Shifts back-left as ring emerges center
      } else {
        lidAngle = -(Math.PI * 0.78);
        boxPos = [-1.3, -0.8, -1.8];
      }

      // Calculate Ring Positioning & Glare Emergence Timeline
      let ringPos = [0, -0.2, 0];
      let ringAlpha = 0;
      let sparkBurstAlpha = 0;

      if (t > T_BOX_OPEN && t <= T_SPARK_BURST) {
        sparkBurstAlpha = (t - T_BOX_OPEN) / (T_SPARK_BURST - T_BOX_OPEN);
      } else if (t > T_SPARK_BURST) {
        const p = easeInOutCubic(Math.min(1.0, (t - T_SPARK_BURST) / (T_RING_EMERGE - T_SPARK_BURST)));
        ringPos = [0, -0.2 + p * 0.2, p * 1.5]; // Glides forward into absolute center viewport
        ringAlpha = Math.min(1.0, (t - T_SPARK_BURST) / 1.5);
        sparkBurstAlpha = Math.max(0, 1.0 - p * 1.2);
      }

      const renderList = [];
      let glintHits = 0;

      // 1. Render Box Base (Fixed Scene Coordinates)
      for (let i = 0; i < BOX_BASE.P.length; i++) {
        const pLocal = BOX_BASE.P[i];
        const nLocal = BOX_BASE.N[i];
        const k = BOX_BASE.KIND[i];

        const worldP = [pLocal[0] + boxPos[0], pLocal[1] + boxPos[1], pLocal[2] + boxPos[2]];
        const q = rot3D(worldP, 0, 0);
        const n = rot3D(nLocal, 0, 0);

        const dif = Math.max(0, dot(n, L1));
        const spec = Math.pow(Math.max(0, dot(n, H1)), 20);

        let rC, gC, bC;
        if (k === 5) { // Metallic Gold Frame Accent
          const bb = 0.35 + 0.65 * dif;
          rC = Math.floor(235 * bb + spec * 120);
          gC = Math.floor(170 * bb + spec * 100);
          bC = Math.floor(90 * bb);
        } else if (k === 4) { // Whitish-Grey Velvet Cushion Interior
          const bb = 0.55 + 0.45 * dif;
          rC = Math.floor(220 * bb + spec * 35);
          gC = Math.floor(225 * bb + spec * 35);
          bC = Math.floor(235 * bb + spec * 35);
        } else if (k === 6) { // Dark Plush Center Slot
          rC = 25; gC = 25; bC = 30;
        } else { // Royal Velvet Exterior
          const bb = 0.2 + 0.8 * dif;
          rC = Math.floor(155 * bb + spec * 30);
          gC = Math.floor(20 * bb);
          bC = Math.floor(40 * bb);
        }

        const sc = F / (DC - q[2]);
        renderList.push({
          z: q[2], sx: W / 2 + q[0] * sc, sy: CY - q[1] * sc,
          char: BOX_BASE.LET[i], sc: sc,
          color: [Math.min(255, rC), Math.min(255, gC), Math.min(255, bC)]
        });
      }

      // 2. Render Box Lid (Hinges UPWARDS and BACKWARDS at Back Edge -Z)
      for (let i = 0; i < BOX_LID.P.length; i++) {
        const pLocal = BOX_LID.P[i];
        const nLocal = BOX_LID.N[i];
        const k = BOX_LID.KIND[i];

        // Pitch lid UPWARDS relative to back pivot line (z = -0.92)
        const pLidRot = rotX(pLocal, lidAngle);
        const nLidRot = rotX(nLocal, lidAngle);

        const worldP = [
          pLidRot[0] + boxPos[0],
          pLidRot[1] + boxPos[1] + 0.25,
          pLidRot[2] + boxPos[2] - 0.92
        ];

        const q = rot3D(worldP, 0, 0);
        const n = rot3D(nLidRot, 0, 0);

        const dif = Math.max(0, dot(n, L1));
        const spec = Math.pow(Math.max(0, dot(n, H1)), 20);

        let rC, gC, bC;
        if (k === 5) { // Gold Rim Accent
          const bb = 0.35 + 0.65 * dif;
          rC = Math.floor(235 * bb + spec * 120);
          gC = Math.floor(170 * bb + spec * 100);
          bC = Math.floor(90 * bb);
        } else if (k === 4) { // Whitish-Grey Satin Ceiling
          const bb = 0.55 + 0.45 * dif;
          rC = Math.floor(225 * bb + spec * 30);
          gC = Math.floor(230 * bb + spec * 30);
          bC = Math.floor(235 * bb + spec * 30);
        } else { // Royal Velvet Roof Exterior
          const bb = 0.2 + 0.8 * dif;
          rC = Math.floor(155 * bb + spec * 30);
          gC = Math.floor(20 * bb);
          bC = Math.floor(40 * bb);
        }

        const sc = F / (DC - q[2]);
        renderList.push({
          z: q[2], sx: W / 2 + q[0] * sc, sy: CY - q[1] * sc,
          char: BOX_LID.LET[i], sc: sc,
          color: [Math.min(255, rC), Math.min(255, gC), Math.min(255, bC)]
        });
      }

      // 3. Render High-Intensity ASCII Text Glare / Sparkle Burst
      if (sparkBurstAlpha > 0.01) {
        const burstOrigin = [boxPos[0], boxPos[1] + 0.15, boxPos[2] + 0.2];
        const qB = rot3D(burstOrigin, 0, 0);
        const scB = F / (DC - qB[2]);
        const bx = W / 2 + qB[0] * scB;
        const by = CY - qB[1] * scB;

        for (let i = 0; i < BURST_PARTICLES.length; i++) {
          const p = BURST_PARTICLES[i];
          const dist = p.speed * sparkBurstAlpha;
          const px = bx + p.dir[0] * dist * scB;
          const py = by - p.dir[1] * dist * scB;
          const pZ = qB[2] + p.dir[2] * dist;

          const brightness = Math.floor(255 * (1.0 - Math.min(1.0, dist * 0.8)));
          renderList.push({
            z: pZ, sx: px, sy: py,
            char: p.char, sc: scB * (1.0 + dist * 1.5),
            color: [brightness, Math.floor(brightness * 0.96), Math.floor(brightness * 0.85)]
          });
        }
      }

      // 4. Render 3D Ring (ONLY the Ring Rotates on User Touch Swipe)
      if (t > T_BOX_OPEN && ringAlpha > 0.01) {
        for (let i = 0; i < RING_P.length; i++) {
          const k = RING_KIND[i];
          let e = Math.min(Math.max((t - START[k] - RING_D[i] * SPAN[k]) / 0.7, 0), 1);
          e = 1 - Math.pow(1 - e, 3);
          e *= ringAlpha;

          const pFar = [
            RING_P[i][0] + (1 - e) * RING_FAR[i][0],
            RING_P[i][1] + (1 - e) * RING_FAR[i][1],
            RING_P[i][2] + (1 - e) * RING_FAR[i][2]
          ];

          // Rotate Ring Local Mesh via User Touch Swipe (X & Y axes)
          const pRingRot = rot3D(pFar, ringRotX, ringRotY);
          const nRingRot = rot3D(RING_N[i], ringRotX, ringRotY);

          // Translate transformed ring to centered screen position
          const worldP = [
            pRingRot[0] + ringPos[0],
            pRingRot[1] + ringPos[1],
            pRingRot[2] + ringPos[2]
          ];

          const q = rot3D(worldP, 0, 0);
          const n = rot3D(nRingRot, 0, 0);

          function spec(L, kPower) {
            const h = unit([L[0], L[1], L[2] + 1]);
            return Math.pow(Math.max(0, dot(n, h)), kPower);
          }

          const dif = Math.max(0, dot(n, L1));
          const isGem = (k === 2);

          const b = isGem
            ? 0.12 + 1.3 * spec(L2, 40) + 0.7 * spec(L1, 30)
            : 0.22 + 0.5 * dif + 0.9 * spec(L1, 20) + 0.8 * spec(L2, 30);

          if (isGem && b > 0.9 && e > 0.5) glintHits++;

          const bb = Math.min(Math.max(b, 0), 1);
          const hot = Math.min(Math.max(b - 0.85, 0), 1) * 255;
          const ph = Math.atan2(n[2], n[0]) * 3 + t * 3;

          const rb = [
            0.5 + 0.5 * Math.sin(ph),
            0.5 + 0.5 * Math.sin(ph + 2.1),
            0.5 + 0.5 * Math.sin(ph + 4.2)
          ];

          let rC, gC, bC;
          if (isGem) {
            const factor = 255 * bb;
            rC = factor * (0.6 + 0.4 * rb[0]);
            gC = factor * (0.6 + 0.4 * rb[1]);
            bC = factor * (0.6 + 0.4 * rb[2]);
          } else {
            rC = 235 * bb + hot;
            gC = 170 * bb + hot;
            bC = 90  * bb + hot;
          }

          const fade = Math.min(Math.max(0.6 + 0.3 * q[2], 0.2), 1) * e;
          rC = Math.floor(Math.min(Math.max(rC * fade, 0), 255));
          gC = Math.floor(Math.min(Math.max(gC * fade, 0), 255));
          bC = Math.floor(Math.min(Math.max(bC * fade, 0), 255));

          if (e >= 0.02 && Math.max(rC, gC, bC) >= 14) {
            const sc = F / (DC - q[2]);
            renderList.push({
              z: q[2], sx: W / 2 + q[0] * sc, sy: CY - q[1] * sc,
              char: RING_LET[i], sc: sc,
              color: [rC, gC, bC]
            });
          }
        }
      }

      // 5. Render Orbiting Comets (Anchored to transformed ring rotation matrix)
      if (t >= T_RING_EMERGE) {
        const kHalo = Math.min(1.0, (t - T_RING_EMERGE) / 1.2);
        for (let orb of ORBITS) {
          for (let j = 0; j < 70; j++) {
            const rawO = getOrbitPoint(t, orb.ex, orb.ey, orb.rx, orb.ry, orb.sp, j);
            const oRot = rot3D(rawO, ringRotX, ringRotY);
            const oWorld = [oRot[0] + ringPos[0], oRot[1] + ringPos[1], oRot[2] + ringPos[2]];
            const o = rot3D(oWorld, 0, 0);

            const sc = F / (DC - o[2]);
            const v = Math.floor(255 * kHalo * Math.pow(j / 69, 2));

            renderList.push({
              z: o[2], sx: W / 2 + o[0] * sc, sy: CY - o[1] * sc,
              char: WORDS[j % 8], sc: sc,
              color: [Math.floor(v * 0.9), v, v]
            });
          }
        }
      }

      // --- Painter's Algorithm Depth Sort ---
      renderList.sort((a, b) => a.z - b.z);

      // --- Render ASCII Character Points ---
      let visibleLetters = 0;
      for (let i = 0; i < renderList.length; i++) {
        const pt = renderList[i];
        const fontSize = Math.max(6, Math.floor(0.0016 * pt.sc * 20));
        renderPointGlyph(ctx, pt.char, pt.sx, pt.sy, fontSize, pt.color[0], pt.color[1], pt.color[2]);
        visibleLetters++;
      }

      // --- Double-Buffered Gaussian Blur Bloom Pass ---
      bloomCtx.clearRect(0, 0, W, H);
      bloomCtx.drawImage(canvas, 0, 0);

      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = 0.75;
      ctx.filter = 'blur(16px)';
      ctx.drawImage(bloomCanvas, 0, 0);

      ctx.globalAlpha = 0.35;
      ctx.filter = 'blur(4px)';
      ctx.drawImage(bloomCanvas, 0, 0);
      ctx.restore();

      // --- HUD Overlay Elements ---
      ctx.font = '22px monospace';
      ctx.fillStyle = 'rgb(135,135,135)';
      ctx.textAlign = 'left';

      const degY = (((ringRotY) * 180 / Math.PI) % 360 + 360) % 360;
      ctx.fillText(`rotation ${degY.toFixed(2).padStart(6, ' ')} deg`, 30, 50);
      ctx.fillText(`glints   ${glintHits}`, 30, 82);
      ctx.fillText(`letters  ${visibleLetters.toLocaleString()}`, 30, 114);

      ctx.fillStyle = 'rgb(110,110,255)';
      ctx.textAlign = 'right';
      ctx.fillText(`t ${t.toFixed(2)}s`, W - 30, 50);

      // Proposal Script Overlay
      if (t > T_PROPOSAL) {
        const msg = "will you be mine forever and ever?";
        const charCount = Math.floor((t - T_PROPOSAL) * 9);
        const part = msg.substring(0, charCount);

        ctx.save();
        ctx.font = 'italic 44px "Brush Script MT", cursive, sans-serif';
        ctx.fillStyle = 'rgb(225, 235, 255)';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(225, 235, 255, 0.8)';
        ctx.shadowBlur = 12;
        ctx.fillText(part, W / 2, 1030);
        ctx.restore();
      }
    }

    // --- Animation Loop ---
    function loop() {
      const now = performance.now();
      const elapsed = (now - startTime) / 1000.0;
      draw(elapsed);
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
